<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모의 운용 | MNQ Trader</title>
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="theme-color" content="#1d2431">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem("theme") === "light" ? "light" : "dark";</script>
</head>
<body class="news-page">
  <a class="skip-link" href="#detail">본문으로 건너뛰기</a>
  <header>
    <nav class="pages" aria-label="페이지">
      <a href="chart.html">실시간 차트</a>
      <a href="paper.html" class="active" aria-current="page">모의 운용</a>
      <a href="orders.html">주문 기록</a>
    </nav>
    <span id="updated" class="conn" role="status"></span>
  </header>

  <main id="content" class="paper-wrap">
    <aside id="rail" class="rail" aria-label="모의 운용 후보"></aside>

    <div id="detail" class="paper-main" tabindex="-1">
      <div id="banner"></div>

      <div class="paper-head">
        <div>
          <h1><span id="title">모의 운용</span> <small id="subtitle"></small></h1>
          <p id="period"></p>
        </div>
      </div>

      <div id="message" class="note">불러오는 중…</div>
      <section id="kpis" class="kpis" aria-label="계좌 요약" hidden></section>

      <section class="card chart-card">
        <div class="chart-top">
          <div id="views" class="segmented" role="group" aria-label="그래프 종류"></div>
          <div id="chart-note" class="chart-key"></div>
        </div>
        <div id="paper-chart" class="equity-chart" hidden></div>
        <div class="chart-grip" role="separator" aria-orientation="horizontal" aria-label="그래프 높이 조절 (위아래 화살표)" tabindex="0" title="끌어서 그래프 높이 조절"></div>
      </section>

      <section id="summary-card" class="card" hidden>
        <h2>대회 기준 성적 <small>과거 데이터를 대회와 같은 4주(거래일 20일) 구간으로 잘라 본 수익률과 MDD</small></h2>
        <div id="summary"></div>
      </section>

      <div id="tabs" class="tabs" role="tablist" aria-label="자세히 보기"></div>
      <section id="panel" class="card panel" role="tabpanel"></section>

      <p class="disclaimer">실제 주문을 내지 않는 가상의 계좌입니다. 과거 데이터에 기반한 참고 자료이며 수익을 보장하지 않습니다.</p>
    </div>
  </main>

  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="paper.js"></script>
  <script src="theme.js"></script>
  <script src="grip.js"></script>
</body>
</html>
