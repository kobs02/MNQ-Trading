<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>실시간 차트 | MNQ Trader</title>
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="theme-color" content="#1d2431">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem("theme") === "light" ? "light" : "dark";</script>
  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <a class="skip-link" href="#side">매매 정보로 건너뛰기</a>
  <header>
    <nav class="pages" aria-label="페이지">
      <a href="chart.html" class="active" aria-current="page">실시간 차트</a>
      <a href="paper.html">모의 운용</a>
      <a href="orders.html">주문 기록</a>
      <a href="news.html">뉴스 · 심리</a>
      <a href="relax.html">스트레스 발산!!</a>
    </nav>
    <span id="conn" class="conn" role="status">연결 중…</span>
  </header>

  <main>
    <div id="chart-col">
      <h1 class="sr-only">MNQ 실시간 차트</h1>
      <!-- 종목 줄: 무엇을 보고 있는가(종목, 가격) 왼쪽, 봉 단위 오른쪽 -->
      <div class="instrument">
        <div class="symbol-name"><b id="symbol">MNQ</b><small id="symbol-name">Micro E-mini Nasdaq-100</small></div>
        <span id="price" class="price">-</span>
        <span id="change" class="change"></span>
        <nav id="intervals" class="pill-group" aria-label="봉 단위"></nav>
      </div>
      <section id="chart-wrap">
        <div id="chart"></div>
        <nav id="tools" class="pill-group" aria-label="차트 도구">
          <button data-tool="hline" aria-pressed="false" title="누른 가격에 가로선 · 단축키 Alt + H: 마우스 자리에 바로">수평선</button>
          <button data-tool="trend" aria-pressed="false" title="두 점을 눌러 추세선 · 고른 뒤 양 끝 손잡이를 끌어 옮긴다">추세선</button>
          <button data-tool="box" aria-pressed="false" title="두 번 눌러 사각형 · Ctrl을 누른 채 드래그해도 된다 (Shift + 드래그는 재기: 현재가 기준 몇 %)">박스</button>
          <button data-study="macd" aria-pressed="false" title="MACD 12, 26, 9">MACD</button>
          <button data-study="rsi" aria-pressed="false" title="RSI 14">RSI</button>
          <button data-study="ichimoku" aria-pressed="false" title="일목균형표 9, 26, 52">일목</button>
          <input type="color" id="hline-color" class="hline-color" hidden title="고른 수평선의 색" aria-label="고른 수평선의 색">
          <button data-tool="clear" title="수평선·추세선·박스를 눌러 고른 뒤 지운다(Delete 키도 된다). 고른 것이 없으면 모두 지울지 묻는다">지우기</button>
        </nav>
        <svg id="draw" class="draw-layer" aria-hidden="true"></svg>
        <div id="legend" class="legend"></div>
        <div id="chart-msg" class="chart-msg" role="status">차트를 불러오는 중…</div>
        <div id="ctx-menu" class="ctx-menu" role="menu" hidden></div>
      </section>
      <!-- LS 모의계좌의 실제 자산과 포지션(바이낸스의 포지션 칸처럼) -->
      <section id="account" class="account-panel" aria-labelledby="account-title">
        <div class="account-head">
          <h2 id="account-title">LS 모의계좌 <small id="account-note"></small></h2>
          <dl id="account-sum" class="account-sum"></dl>
          <!-- 주문 칸의 '포지션 정리'와 같은 버튼(같은 확인 창). 표는 0.5초마다 다시 그려서 버튼을 표 밖에 둔다 -->
          <button id="account-flat" class="account-flat" type="button" title="모든 포지션을 시장가로 정리하고 자동 주문을 멈춘다">포지션 정리</button>
        </div>
        <div id="account-pos" class="account-pos"></div>
      </section>
    </div>
    <div id="resizer" class="resizer" role="separator" aria-orientation="vertical" aria-label="차트와 매매 정보 크기 조절" tabindex="0" title="드래그하거나 좌우 화살표로 크기를 조절합니다 (더블클릭: 원래대로)"></div>
    <aside id="side" tabindex="-1">
      <!-- 주문: 대회에 쓸 매매법, 자동 주문 켜고 끄기, 직접 주문 -->
      <section class="card trade-card">
        <h2>주문 <small id="live-note"></small>
          <span class="card-actions"><button id="auto-toggle" class="auto-toggle" aria-pressed="false">자동 주문 꺼짐</button></span></h2>
        <div id="live-pos"></div>
        <button id="cancel-pending" class="cancel-pending" type="button" hidden>미체결 주문 취소</button>
        <h3 class="trade-sub">시장가</h3>
        <!-- 직접 매수·매도의 비중: 잔고의 몇 %를 증거금으로 쓸지(코인 거래소처럼). 계약은 정수라 그 %에 들어가는 계약 수로 내린다(최소 1). 지정가 진입도 이 계약 수 -->
        <div class="size-bar">
          <label for="size">비중</label>
          <input id="size" type="range" min="5" max="100" step="5" value="5" aria-describedby="size-out">
          <output id="size-out" for="size"></output>
        </div>
        <div id="trade-buttons" class="trade-buttons">
          <button class="buy" data-qty="1" disabled>매수 1계약</button>
          <button class="sell" data-qty="-1" disabled>매도 1계약</button>
          <button class="flip" data-flip disabled title="롱이면 숏으로, 숏이면 롱으로 같은 계약 수만큼 뒤집는다(시장가 한 건). 자동 주문은 꺼진다">포지션 뒤집기</button>
          <button class="flat" data-flatten disabled title="모든 포지션을 시장가로 정리하고 자동 주문을 멈춘다(켜 두면 30초 뒤 목표 계약 수로 다시 들기 때문)">포지션 정리 <small>(자동 주문 멈춤)</small></button>
        </div>
        <h3 class="trade-sub">지정가 <small>차트 우클릭으로도</small></h3>
        <div class="limit-close">
          <input id="limit-price" type="number" step="0.25" min="0" inputmode="decimal" aria-label="지정가 가격" placeholder="지정가">
          <button id="limit-now" type="button" title="가격 칸을 지금 시장 가격(마지막 체결가)으로 바꾼다">최신 가격</button>
        </div>
        <!-- 지정가 진입: 위 가격 칸의 가격에 비중 막대의 계약 수만큼. 차트 우클릭 메뉴도 이 버튼들을 누른다 -->
        <div id="limit-open" class="limit-open">
          <button class="buy" data-side="1" disabled>지정가 매수</button>
          <button class="sell" data-side="-1" disabled>지정가 매도</button>
          <button id="limit-btn" class="close" data-limit disabled title="지금 포지션 전부를 이 가격의 지정가 한 건으로 닫는다. 자동 주문은 꺼진다">지정가 정리</button>
        </div>
        <h3 class="trade-sub">자동 주문</h3>
        <label class="live-pick">대회 매매법 <select id="live-pick" aria-label="대회 매매법"></select></label>
        <div id="live"></div>
      </section>
      <!-- 매매법: 차트에 표시할 후보, 그 후보의 지금 포지션과 근거 -->
      <section class="card">
        <h2>매매법 <small id="why-note"></small></h2>
        <nav id="picks" class="pill-group pick-tabs" aria-label="차트에 표시할 매매법"></nav>
        <div id="why"></div>
      </section>
    </aside>
  </main>

  <!-- 확인·알림 창(브라우저 confirm·alert 대신). 처음 초점은 취소에 간다(Enter 한 번으로 주문이 나가지 않게) -->
  <dialog id="ask" class="doc-dialog ask-dialog" aria-labelledby="ask-title">
    <form method="dialog">
      <header><h2 id="ask-title">확인</h2></header>
      <p id="ask-text" class="ask-text"></p>
      <footer class="ask-buttons"><button id="ask-cancel" value="cancel">취소</button><button id="ask-ok" value="ok" class="primary">확인</button></footer>
    </form>
  </dialog>

  <script src="chart.js"></script>
  <script src="theme.js"></script>
</body>
</html>
