<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>타임랩스 | MNQ Trader</title>
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="theme-color" content="#13161b">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem("theme") === "light" ? "light" : "dark";</script>
  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body class="news-page">
  <a class="skip-link" href="#content">본문으로 건너뛰기</a>
  <header>
    <nav class="pages" aria-label="페이지">
      <a href="chart.html">실시간 차트</a>
      <a href="orders.html">주문 기록</a>
      <a href="timelapse.html" class="active" aria-current="page">타임랩스</a>
      <a href="news.html">뉴스 · 심리</a>
    </nav>
    <span id="updated" class="conn" role="status"></span>
  </header>

  <!-- 끝난 매매(포지션 0 → 열기 → 0)를 1분봉으로 진입부터 청산까지 다시 돌려 본다 -->
  <main id="content" class="page-wrap" tabindex="-1">
    <div class="paper-head">
      <h1>타임랩스 <small>끝난 매매 · 1분봉 · 한국 시각</small></h1>
    </div>
    <section class="card">
      <div class="paper-head">
        <h2 id="tl-title">매매를 고르세요</h2>
        <div class="head-tools">
          <button id="play" type="button" class="plain-button" disabled>▶ 재생</button>
          <label class="tl-speed">속도 <select id="speed">
            <option value="2">초당 2봉</option><option value="5">초당 5봉</option><option value="10" selected>초당 10봉</option><option value="30">초당 30봉</option><option value="60">초당 60봉</option>
          </select></label>
        </div>
      </div>
      <div id="hud" class="stats order-stats"></div>
      <div class="trade-chart-wrap"><div id="tl-chart" class="trade-chart"></div></div>
      <input id="seek" class="tl-seek" type="range" min="0" max="0" value="0" disabled aria-label="재생 위치">
      <p class="why-foot">진입 30분 전부터 청산 10분 뒤까지 1분봉을 하나씩 그립니다. 점선은 평균 진입가, 평가 손익은 그 봉 종가 기준(수수료 전)입니다. 봉 안에서 언제 체결됐는지는 1분봉이라 알 수 없습니다.</p>
    </section>
    <section class="card">
      <h2>끝난 매매 <small>최근 것부터 · 눌러서 재생</small></h2>
      <div class="table-scroll"><table class="trend-table order-table tl-table">
        <thead><tr><th>진입 (한국)</th><th>청산</th><th>방향</th><th>최대 계약</th><th>진입가</th><th>청산가</th><th>보유</th><th>체결</th><th title="실현 손익 - 체결 1계약당 $2">대회 기준 손익</th></tr></thead>
        <tbody id="trips"><tr><td colspan="9" class="empty">불러오는 중…</td></tr></tbody>
      </table></div>
    </section>
  </main>

  <script src="trades.js"></script>
  <script src="timelapse.js"></script>
  <script src="theme.js"></script>
</body>
</html>
