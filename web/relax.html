<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스트레스 발산!! | MNQ Trader</title>
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="theme-color" content="#1d2431">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem("theme") === "light" ? "light" : "dark";</script>
  <style>
    .kb-wrap { max-width: 980px; margin: 0 auto; }
    .rg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 16px; align-items: start; }
    .rg-lane { position: relative; }
    .rg-lane canvas { display: block; width: 100%; height: 600px; border-radius: 14px; border: 1px solid var(--border); background: var(--sunken); }
    .rg-over { position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center; border-radius: 14px; background: rgba(5, 7, 13, .55); color: #fff; }
    .rg-over[hidden] { display: none; }
    .rg-over p { margin: 0; color: #d6dbe6; }
    .rg-start { padding: 12px 28px; border: 0; border-radius: 99px; background: var(--brand-grad); color: var(--on-solid); font: inherit; font-size: 18px; font-weight: 800; cursor: pointer; }
    .rg-side { display: grid; gap: 16px; }
    .rg-opts { display: grid; gap: 12px; padding: 18px; }
    .rg-opts label, .rg-opts .rg-label { font-size: 13px; color: var(--text-3); }
    .rg-diff { display: flex; flex-wrap: wrap; gap: 6px; }
    .rg-diff .plain-button { margin-left: 0; }
    .rg-diff .plain-button[aria-pressed="true"] { background: var(--select-bg); color: var(--select-text); border-color: var(--select-bg); }
    .rg-speed { display: flex; align-items: center; gap: 10px; }
    .rg-speed input { flex: 1; accent-color: var(--brand); }
    .rg-speed output { min-width: 3.5em; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); }
    .rg-stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .rg-stats b { color: var(--text); }
    .grow { position: relative; overflow: hidden; display: grid; justify-items: center; gap: 6px; padding: 22px 20px 20px; text-align: center; user-select: none; }
    .grow-name { font-size: 15px; color: var(--text-2); }
    .grow-name b { color: var(--text); font-size: 18px; }
    .grow-pic { font-size: 100px; line-height: 1.1; transition: transform .08s; }
    .grow-pic.bump { transform: scale(1.06); }
    .grow-pic.evolve { animation: evolve .9s ease-out; }
    @keyframes evolve { 0% { transform: scale(.3) rotate(-20deg); filter: brightness(3); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
    .grow-score { font-size: 36px; font-weight: 800; font-variant-numeric: tabular-nums; background: var(--brand-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .grow-bar { width: min(420px, 100%); height: 10px; border-radius: 99px; background: var(--sunken); border: 1px solid var(--border); overflow: hidden; }
    .grow-bar > div { height: 100%; width: 0; background: var(--brand-grad); transition: width .15s; }
    .grow-next { font-size: 13px; color: var(--text-3); }
    .toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); padding: 6px 16px; border-radius: 99px; background: var(--select-bg); color: var(--select-text); font-weight: 700; white-space: nowrap; animation: toast 2.2s ease-out forwards; pointer-events: none; }
    @keyframes toast { 0% { opacity: 0; transform: translate(-50%, -10px); } 15%, 75% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
    .rg-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--text-3); }
    .rg-foot .plain-button { margin-left: auto; }
    @media (max-width: 760px) { .rg { grid-template-columns: 1fr; } .rg-lane { order: -1; } .rg-lane canvas { height: 480px; } .grow-pic { font-size: 72px; } }
    @media (prefers-reduced-motion: reduce) { .grow-pic.evolve, .toast { animation-duration: .01s; } }
  </style>
</head>
<body class="news-page">
  <a class="skip-link" href="#content">본문으로 건너뛰기</a>
  <header>
    <nav class="pages" aria-label="페이지">
      <a href="chart.html">실시간 차트</a>
      <a href="paper.html">모의 운용</a>
      <a href="orders.html">주문 기록</a>
      <a href="news.html">뉴스 · 심리</a>
      <a href="relax.html" class="active" aria-current="page">스트레스 발산!!</a>
    </nav>
  </header>
  <!-- 4버튼 리듬게임(S·D·L·;)으로 키우기: 노트를 맞히면 점수가 오르고, 점수가 쌓이면 단계가 자란다. 타건음은 Mechvibes NK Cream 녹음(web/sounds/nk-cream, MIT) -->
  <main id="content" class="page-wrap kb-wrap" tabindex="-1">
    <div class="paper-head">
      <div><h1>스트레스 발산!! <small>S · D · L · ; 로 노트를 맞혀 키우기</small></h1></div>
    </div>

    <div class="rg">
      <div class="rg-side">
        <section class="card rg-opts">
          <div>
            <div class="rg-label" id="diff-label">난이도</div>
            <div class="rg-diff" id="diff" role="group" aria-labelledby="diff-label"></div>
          </div>
          <div>
            <label for="speed">노트 속도 (0.5 단위)</label>
            <div class="rg-speed"><input type="range" id="speed" min="1" max="10" step="0.5"><output id="speed-out" for="speed"></output></div>
          </div>
          <div class="rg-stats" id="stats"></div>
        </section>

        <section class="card grow" id="grow">
          <div class="grow-name" id="stage-name"></div>
          <div class="grow-pic" id="pic" aria-hidden="true"></div>
          <div class="grow-score" id="score"></div>
          <div class="grow-bar"><div id="bar"></div></div>
          <div class="grow-next" id="next"></div>
        </section>

        <div class="rg-foot">
          <span>PERFECT +3 · GREAT +2 · GOOD +1, 콤보 20 ×2 · 50 ×3 · 100 ×5</span>
          <button id="reset" class="plain-button">처음부터</button>
        </div>
      </div>
      <div class="rg-lane">
        <canvas id="lane" aria-label="리듬게임 레인"></canvas>
        <div class="rg-over" id="over">
          <p id="over-msg">떨어지는 노트가 판정선에 닿을 때 S · D · L · ; 를 누르세요</p>
          <button class="rg-start" id="start">시작</button>
          <p><small>Space로 멈춤</small></p>
        </div>
      </div>

    </div>
  </main>

  <dialog id="ask" class="doc-dialog ask-dialog" aria-labelledby="ask-title">
    <form method="dialog">
      <header><h2 id="ask-title">처음부터</h2></header>
      <p class="ask-text">처음(씨앗)부터 다시 키울까요? 지금까지 키운 점수가 0이 됩니다.</p>
      <footer class="ask-buttons"><button value="cancel">취소</button><button value="ok" class="primary">처음부터</button></footer>
    </form>
  </dialog>

  <script src="relax.js"></script>
  <script src="theme.js"></script>
</body>
</html>
